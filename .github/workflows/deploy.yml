# Git flow : main → prod (horaire.gcdeveloppement.fr). develop → staging seulement si la variable de dépôt STAGING vaut "true".
# 1. Construit l'image Docker et la pousse sur GHCR (ghcr.io/gcdeveloppement-code/horairegc:<branche>).
# 2. Se connecte au VPS en SSH, récupère l'image et relance docker compose dans le dossier de l'environnement.
#
# Secrets du dépôt : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée dédiée), VPS_PORT (715 chez GC ; 22 par défaut si absent).
# Sur le VPS : /opt/horairegc (docker-compose.yml + .env), préparé par deploy/installer-vps.sh. Staging : /opt/horairegc-staging.
name: Déploiement

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vps:
    name: Mise en ligne (${{ github.ref_name == 'main' && 'prod' || 'staging' }})
    needs: image
    if: github.ref_name == 'main' || vars.STAGING == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DOSSIER: ${{ github.ref_name == 'main' && '/opt/horairegc' || '/opt/horairegc-staging' }}
    steps:
      - name: Vérification des secrets
        run: |
          manque=0
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant (Settings → Secrets and variables → Actions)"; manque=1; fi
          done
          [ "$manque" = 0 ] || exit 1
          case "$VPS_SSH_KEY" in *"BEGIN "*"PRIVATE KEY"*) ;; *) echo "::error::VPS_SSH_KEY ne ressemble pas à une clé privée : colle tout le fichier, lignes BEGIN et END comprises"; exit 1 ;; esac
          # espaces et retours à la ligne collés par accident dans les secrets
          hote=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          util=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          port=$(printf '%s' "$VPS_PORT" | tr -d '[:space:]')
          echo "Longueurs reçues : hôte ${#VPS_HOST} → ${#hote}, utilisateur ${#VPS_USER} → ${#util}, port ${#VPS_PORT} → ${#port}"
          [ "${#VPS_HOST}" = "${#hote}" ] && [ "${#VPS_USER}" = "${#util}" ] || echo "::warning::Un secret contenait des espaces ou un retour à la ligne : ils ont été retirés, pense à recoller la valeur proprement"
          case "$port" in ''|*[!0-9]*) echo "::error::VPS_PORT n'est pas un nombre"; exit 1 ;; esac
          {
            echo "VPS_HOST=$hote"
            echo "VPS_USER=$util"
            echo "VPS_PORT=$port"
          } >> "$GITHUB_ENV"
      - name: Clé SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          ssh-keygen -y -f ~/.ssh/vps > ~/.ssh/vps.pub || { echo "::error::Clé privée illisible (VPS_SSH_KEY)"; exit 1; }
          echo "Empreinte de la clé utilisée (« ssh-keygen -lf /home/deploy/.ssh/github_actions.pub » sur le VPS) :"
          ssh-keygen -lf ~/.ssh/vps.pub
      - name: Mise en ligne
        id: ssh
        run: |
          ssh -i ~/.ssh/vps -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o BatchMode=yes "$VPS_USER@$VPS_HOST" "DOSSIER='$DOSSIER' bash -s" <<'EOF'
          set -e
          cd "$DOSSIER"
          docker compose pull app
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          docker compose ps
          EOF
      - name: Diagnostic (si échec)
        if: failure() && steps.ssh.outcome == 'failure'
        run: |
          echo "Empreinte de la machine jointe (« sudo ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub » sur le VPS) :"
          ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null || echo "(inconnue)"
          echo "Utilisateur demandé : [$VPS_USER] · port : [$VPS_PORT]"
          echo "--- négociation SSH ---"
          ssh -vv -i ~/.ssh/vps -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o BatchMode=yes "$VPS_USER@$VPS_HOST" true 2>&1 | grep -viE "debug2: (kex|mac|compress|cipher|host key algorithms)" | tail -40 || true
