# Git flow : main → prod (horaire.gcdeveloppement.fr). develop → staging seulement si la variable de dépôt STAGING vaut "true".
# 1. Construit l'image Docker et la pousse sur GHCR (ghcr.io/gcdeveloppement-code/horairegc:<branche>).
# 2. Se connecte au VPS en SSH, récupère l'image et relance docker compose dans le dossier de l'environnement.
#
# Secrets du dépôt : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée dédiée), VPS_PORT (715 chez GC ; 22 par défaut si absent).
# Sur le VPS : /opt/horairegc (docker-compose.yml + .env), préparé par deploy/installer-vps.sh. Staging : /opt/horairegc-staging.
name: Déploiement

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vps:
    name: Mise en ligne (${{ github.ref_name == 'main' && 'prod' || 'staging' }})
    needs: image
    if: github.ref_name == 'main' || vars.STAGING == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DOSSIER: /opt/horairegc${{ github.ref_name == 'main' && '' || '-staging' }}
    steps:
      - name: Vérification des secrets
        run: |
          manque=0
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant (Settings → Secrets and variables → Actions)"; manque=1; fi
          done
          [ "$manque" = 0 ] || exit 1
          case "$VPS_SSH_KEY" in *"BEGIN "*"PRIVATE KEY"*) ;; *) echo "::error::VPS_SSH_KEY ne ressemble pas à une clé privée : colle tout le fichier, lignes BEGIN et END comprises"; exit 1 ;; esac
          echo "Cible : $VPS_USER@$VPS_HOST:$VPS_PORT, dossier $DOSSIER"
      - name: Clé SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          ssh-keygen -y -f ~/.ssh/vps >/dev/null || { echo "::error::Clé privée illisible (VPS_SSH_KEY)"; exit 1; }
      - name: Mise en ligne
        run: |
          ssh -i ~/.ssh/vps -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o BatchMode=yes "$VPS_USER@$VPS_HOST" "DOSSIER='$DOSSIER' bash -s" <<'EOF'
          set -e
          cd "$DOSSIER"
          docker compose pull app
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          docker compose ps
          EOF
