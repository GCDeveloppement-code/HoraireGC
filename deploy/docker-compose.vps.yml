# Sur le VPS : /opt/horairegc/docker-compose.yml (ce fichier) + .env à côté.
# Le script deploy/installer-vps.sh met tout ça en place.
#
# .env attendu :
#   IMAGE=ghcr.io/gcdeveloppement-code/horairegc:main
#   DOMAINE=horaire.gcdeveloppement.fr
#   PORT_LOCAL=3010
#   POSTGRES_PASSWORD=un-mot-de-passe-solide
#   AUTH_SECRET=une-longue-chaine-aleatoire
#   APP_URL=https://horaire.gcdeveloppement.fr
#   SEED_PASSWORD=mot-de-passe-provisoire-du-seed
#   SEED_AU_DEMARRAGE=1   (au premier démarrage seulement, puis 0)
#
# Deux façons d'exposer l'appli :
#   - un reverse proxy déjà présent sur le VPS (Nginx, Traefik, Caddy) qui renvoie vers 127.0.0.1:PORT_LOCAL ;
#   - rien sur les ports 80/443 : `docker compose --profile caddy up -d` ajoute Caddy, qui gère le HTTPS tout seul.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hsgc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: heures_sup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsgc -d heures_sup"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hsgc:${POSTGRES_PASSWORD}@db:5432/heures_sup?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL}
      SEED_PASSWORD: ${SEED_PASSWORD:-gc-2026}
      SEED_AU_DEMARRAGE: ${SEED_AU_DEMARRAGE:-0}
    ports:
      - "127.0.0.1:${PORT_LOCAL:-3010}:3000"

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE}
    command: caddy reverse-proxy --from ${DOMAINE} --to app:3000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
